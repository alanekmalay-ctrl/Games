<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSHYAR OFFICE · Games</title>
<style>
:root{--bg:#0a0804;--card:#16120a;--line:#4a3a12;--ink:#fff8e6;--muted:#b3a47a;--blue:#f5b800;--red:#ff9d00;--teal:#2de2c8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 0 0,#f5b80030,transparent),radial-gradient(1200px 500px at 100% 100%,#ff7a0025,transparent),var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",Arial,sans-serif;min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:20px 14px 48px}
a.back{color:var(--blue);text-decoration:none;font-size:.9rem}
h1{margin:14px 0 4px;font-size:2rem;letter-spacing:.04em}
.sub{color:var(--muted);margin:0 0 18px}
.owner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px}
.who{display:flex;flex-direction:column;line-height:1.35}
.who span{color:var(--blue);font-size:.85rem;font-weight:700;letter-spacing:.06em}
.call{color:#0a0804;background:var(--blue);text-decoration:none;font-weight:700;padding:8px 14px;border-radius:999px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font:inherit;cursor:pointer}
.tabs button[aria-pressed=true]{border-color:var(--blue);box-shadow:0 0 12px #f5b80066;color:var(--blue)}
input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.game{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pic{aspect-ratio:3/4;background:#211a0c;display:flex;align-items:center;justify-content:center;font-size:2.2rem}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:8px 10px 10px}
.name{font-weight:700;overflow-wrap:anywhere}
.size{font-size:.8rem;color:var(--muted);margin-top:2px}
.tag{display:inline-block;margin-top:4px;font-size:.78rem;font-weight:700;padding:0 8px;border-radius:4px;color:#0a0804}
.PS3{background:#aab2d5}.PS4{background:var(--blue)}.PS5{background:var(--teal)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>GAMES LIST</h1>
  <p class="sub">PS3 · PS4 · PS5</p>
  <div class="owner">
    <div class="who"><b>ALLAN HSHYAR</b><span>HSHYAR OFFICE</span></div>
    <a class="call" href="tel:+9647505047363" aria-label="Call 0750 504 7363">&#9742; 0750 504 7363</a>
  </div>
  <input id="q" type="search" placeholder="Search..." aria-label="Search games">
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</main>
<script>
/* ====== زێدەکرنا یاریان ل ڤێرێ ======
   هەر یاریەک یەک ڕێزە. "img" ئارەزوومەندانەیە (مەسەلەن "images/cod.jpg"). */
var GAMES=[
  {name:"EA Sports FC 27", platform:"PS4", img:"", size:"~50 GB"},
  {name:"PES 27", platform:"PS4", img:"", size:"~30 GB"},
  {name:"Call of Duty: Black Ops 3", platform:"PS4", img:"", q:"Call of Duty: Black Ops III", size:"~100 GB"},
  {name:"Call of Duty: Modern Warfare 3", platform:"PS4", img:"", size:"~100 GB"},
  {name:"Call of Duty: Ghosts", platform:"PS4", img:"", size:"~40 GB"},
  {name:"Need for Speed Heat", platform:"PS4", img:"", size:"~50 GB"},
  {name:"Need for Speed Payback", platform:"PS4", img:"", size:"~30 GB"},
  {name:"Need for Speed Hot Pursuit", platform:"PS4", img:"", size:"~25 GB"},
  {name:"Marvel's Spider-Man", platform:"PS4", img:"", size:"~45 GB"},
  {name:"Spider-Man: Miles Morales", platform:"PS4", img:"", size:"~50 GB"},
  {name:"The Last of Us Part II", platform:"PS4", img:"", size:"~80 GB"},
  {name:"The Last of Us Remastered", platform:"PS4", img:"", size:"~50 GB"},
  {name:"Ghost of Tsushima", platform:"PS4", img:"", size:"~50 GB"},
  {name:"Uncharted 4: A Thief's End", platform:"PS4", img:"", size:"~50 GB"},
  {name:"Uncharted: The Lost Legacy", platform:"PS4", img:"", size:"~40 GB"},
  {name:"Red Dead Redemption 2", platform:"PS4", img:"", size:"~110 GB"},
  {name:"Grand Theft Auto V", platform:"PS4", img:"", size:"~90 GB"},
  {name:"Elden Ring", platform:"PS4", img:"", size:"~45 GB", q:"Elden Ring"},
  {name:"Minecraft", platform:"PS4", img:"", q:"Minecraft", size:"~2 GB"},
  {name:"Resident Evil 4", platform:"PS4", img:"", size:"~12 GB"},
  {name:"Resident Evil 4 Remake", platform:"PS4", img:"", size:"~50 GB"},
  {name:"Tekken 7", platform:"PS4", img:"", size:"~40 GB"},
  {name:"PES 2018: Pro Evolution Soccer", platform:"PS4", img:"", size:"~25 GB"},
  {name:"Uncharted: The Nathan Drake Collection", platform:"PS4", img:"", size:"~50 GB"},
  {name:"Sekiro: Shadows Die Twice", platform:"PS4", img:"", size:"~15 GB"},
  {name:"Days Gone", platform:"PS4", img:"", size:"~50 GB"},
  {name:"WWE 2K25", platform:"PS4", img:"", size:"~50 GB"},
  {name:"Call of Duty: Modern Warfare", platform:"PS4", img:"", size:"~100 GB"},
  {name:"Mortal Kombat 11", platform:"PS4", img:"", size:"~45 GB"},
  {name:"Crash Bandicoot N. Sane Trilogy", platform:"PS4", img:"", size:"~25 GB"},
  {name:"A Way Out", platform:"PS4", img:"", size:"~20 GB"},
  {name:"It Takes Two", platform:"PS4", img:"", size:"~40 GB"},
  {name:"Resident Evil 2", platform:"PS4", img:"", size:"~25 GB"},
  {name:"Resident Evil 7: Biohazard", platform:"PS4", img:"", size:"~25 GB"},
  {name:"Call of Duty: WWII", platform:"PS4", img:"", size:"~90 GB"},
  {name:"The Witcher 3: Wild Hunt", platform:"PS4", img:"", size:"~50 GB"},
  {name:"Mafia: Definitive Edition", platform:"PS4", img:"", size:"~50 GB"},
  {name:"Crash Bandicoot 4: It's About Time", platform:"PS4", img:"", size:"~30 GB"},
  {name:"Tom Clancy's Ghost Recon: Wildlands", platform:"PS4", img:"", size:"~50 GB"},
  {name:"Resident Evil 4 Remaster", platform:"PS4", img:"", size:"~12 GB"},
  {name:"Resident Evil 3", platform:"PS4", img:"", size:"~40 GB"},
  {name:"Shadow of the Tomb Raider", platform:"PS4", img:"", size:"~50 GB"},
  {name:"Little Nightmares", platform:"PS4", img:"", q:"Little Nightmares (2017 video game)", size:"~5 GB"},
  {name:"The Last Guardian", platform:"PS4", img:"", size:"~20 GB"},
  {name:"Need for Speed: Rivals", platform:"PS4", img:"", size:"~20 GB"},
  {name:"Ben 10", platform:"PS4", img:"", size:"~10 GB"},
  {name:"Assassin's Creed Valhalla", platform:"PS4", img:"", size:"~50 GB"},
  {name:"Dragon Ball Xenoverse 2", platform:"PS4", img:"", size:"~15 GB"},
  {name:"Unravel", platform:"PS4", img:"", size:"~3 GB"},
  {name:"Tomb Raider: Definitive Edition", platform:"PS4", img:"", size:"~20 GB"},
  {name:"Rise of the Tomb Raider", platform:"PS4", img:"", size:"~40 GB"},
  {name:"Watch Dogs 2", platform:"PS4", img:"", size:"~50 GB"},
  {name:"Gang Beasts", platform:"PS4", img:"", size:"~1 GB"},
  {name:"Resident Evil Village", platform:"PS4", img:"", size:"~30 GB"},
  {name:"Assassin's Creed Mirage", platform:"PS4", img:"", size:"~40 GB"},
  {name:"Assassin's Creed Origins", platform:"PS4", img:"", size:"~40 GB"},
  {name:"Battlefield V", platform:"PS4", img:"", q:"Battlefield V", size:"~55 GB"},
  {name:"Call of Duty: Modern Warfare Remastered", platform:"PS4", img:"", size:"~50 GB"}
];
/* ================================== */
var filter="All",query="";

var tried={};
function wikiCover(name,q){
  q=q||(name+" video game");
  var k="cov2:"+q,c=null;
  try{c=localStorage.getItem(k)}catch(e){}
  if(c)return Promise.resolve(c);
  var u="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pilicense=any&pithumbsize=500&generator=search&gsrlimit=1&gsrsearch="+encodeURIComponent(q);
  return fetch(u).then(function(r){return r.json()}).then(function(d){
    var p=d.query&&d.query.pages,t=null;
    if(p){var id=Object.keys(p)[0];t=p[id].thumbnail&&p[id].thumbnail.source}
    if(t){try{localStorage.setItem(k,t)}catch(e){}}
    return t||null;
  }).catch(function(){return null});
}
function slug(n){return n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
function render(){
  var t=document.getElementById("tabs");t.innerHTML="";
  ["All","PS5","PS4","PS3"].forEach(function(f){
    var b=document.createElement("button");b.textContent=f;b.setAttribute("aria-pressed",f===filter);
    b.onclick=function(){filter=f;render()};t.appendChild(b);
  });
  var g=document.getElementById("grid");g.innerHTML="";
  var list=GAMES.filter(function(x){
    return (filter==="All"||x.platform===filter)&&x.name.toLowerCase().indexOf(query)>-1;
  });
  if(!list.length){g.innerHTML='<div class="empty">No games found.</div>';return}
  list.forEach(function(x,idx){
    var d=document.createElement("div");d.className="game";
    var p=document.createElement("div");p.className="pic";
    {var im=document.createElement("img");im.alt="";im.referrerPolicy="no-referrer";setTimeout(function(){im.src=x.img||("images/"+slug(x.name)+".jpg")},idx*150);
      im.onerror=function(){
        if(x.img||tried[x.name]){im.remove();p.textContent="🎮";return}
        tried[x.name]=1;
        wikiCover(x.name,x.q).then(function(u){if(u){im.referrerPolicy="no-referrer";im.src=u}else{im.remove();p.textContent="🎮"}});
      };p.appendChild(im)}
    var i=document.createElement("div");i.className="info";
    var n=document.createElement("div");n.className="name";n.textContent=x.name;
    var s=document.createElement("span");s.className="tag "+x.platform;s.textContent=x.platform;
    i.appendChild(n);if(x.size){var z=document.createElement("div");z.className="size";z.textContent="💾 "+x.size;i.appendChild(z)}i.appendChild(s);d.appendChild(p);d.appendChild(i);g.appendChild(d);
  });
}
document.getElementById("q").oninput=function(e){query=e.target.value.trim().toLowerCase();render()};
render();
</script>
</body>
</html>
