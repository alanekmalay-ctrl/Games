<title>HSHYAR OFFICE · Games</title>
<style>
:root{--bg:#0a0804;--card:#16120a;--line:#4a3a12;--ink:#fff8e6;--muted:#b3a47a;--blue:#f5b800;--red:#ff9d00;--teal:#2de2c8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 0 0,#f5b80030,transparent),radial-gradient(1200px 500px at 100% 100%,#ff7a0025,transparent),var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",Arial,sans-serif;min-height:100vh}
html[lang=ckb] body{font-family:"Noto Sans Arabic",Roboto,"Segoe UI",Tahoma,sans-serif}
html[lang=ckb] .name,html[lang=ckb] .logo,html[lang=ckb] .call,html[lang=ckb] .cap,html[lang=ckb] .price{font-family:Roboto,"Segoe UI",Arial,sans-serif}
main{max-width:1000px;margin:0 auto;padding:0 14px 48px}
a.back{color:var(--blue);text-decoration:none;font-size:.9rem}
h1{margin:14px 0 4px;font-size:2rem;letter-spacing:.04em}
.sub{color:var(--muted);margin:0 0 18px}
.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -14px 16px;padding:10px 14px;background:rgba(10,8,4,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;min-width:0}
.logo .mark{width:42px;height:42px;flex:none;filter:drop-shadow(0 0 10px rgba(245,184,0,.35))}
.logo .word{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.logo b{font-size:1.1rem;font-weight:900;letter-spacing:.06em;white-space:nowrap}
.logo small{color:var(--blue);font-size:.68rem;font-weight:700;letter-spacing:.12em;white-space:nowrap}
.top .call{padding:8px 12px;font-size:.9rem;white-space:nowrap}
@media (max-width:420px){.logo .mark{width:36px;height:36px}.logo{gap:7px}.logo b{font-size:.92rem;letter-spacing:.03em}.logo small{font-size:.58rem;letter-spacing:.06em}.top .call{font-size:.8rem;padding:7px 10px}}
@media (max-width:350px){.logo small{display:none}}
.owner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px}
.who{display:flex;flex-direction:column;line-height:1.35}
.who span{color:var(--blue);font-size:.85rem;font-weight:700;letter-spacing:.06em}
.call{color:#0a0804;background:var(--blue);text-decoration:none;font-weight:700;padding:8px 14px;border-radius:999px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font:inherit;cursor:pointer}
.tabs button[aria-pressed=true]{border-color:var(--blue);box-shadow:0 0 12px #f5b80066;color:var(--blue)}
input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.game{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pic{aspect-ratio:3/4;background:#211a0c;display:flex;align-items:center;justify-content:center;font-size:2.2rem}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:8px 10px 10px}
.name{font-weight:700;overflow-wrap:anywhere}
.size{font-size:.8rem;color:var(--muted);margin-top:2px}
.tag{display:inline-block;margin-top:4px;font-size:.78rem;font-weight:700;padding:0 8px;border-radius:4px;color:#0a0804}
.PS3{background:#aab2d5}.PS4{background:var(--blue)}.PS5{background:var(--teal)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 12px;color:var(--muted);font-size:.9rem}
.pager{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:22px 0 4px}
.pager button{min-width:40px;height:40px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.pager button[aria-current=page]{background:var(--blue);color:#0a0804;border-color:var(--blue)}
.pager button:disabled{opacity:.35;cursor:default}
.pic{position:relative}
.pic img{opacity:0;transition:opacity .25s}
.pic img.on{opacity:1}
.pic.contain img{object-fit:contain;background:#000}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.packhead{grid-column:1/-1;color:var(--blue);font-weight:800;font-size:.95rem;margin:6px 0 -2px}
.pack{text-align:left;background:linear-gradient(160deg,#2a2008,#16120a 70%);border:1px solid var(--blue);border-radius:14px;padding:12px 14px;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.pack .cap{font-size:1.5rem;font-weight:900;letter-spacing:.02em}
.pack .meta{color:var(--muted);font-size:.85rem}
.pack .price{color:var(--blue);font-weight:800;font-size:1.1rem;margin-top:4px}
.pkghead{display:none;background:var(--card);border:1px solid var(--blue);border-radius:14px;padding:14px;margin:0 0 16px}
.pkghead h2{margin:4px 0 2px;font-size:1.6rem}
.pkghead .price{color:var(--blue);font-weight:800;font-size:1.2rem}
.pkghead .meta{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;border-radius:999px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.main{background:var(--blue);border-color:var(--blue);color:#0a0804}
.btn.wa{background:#25d366;border-color:#25d366;color:#04140a}
.linkbtn{background:none;border:0;color:var(--blue);font:inherit;font-weight:700;cursor:pointer;padding:0}
body.pkg .packs,body.pkg #q,body.pkg #tabs,body.pkg #bar,body.pkg #pager,body.pkg .hint{display:none}
body.pkg .pkghead{display:block}
.hint{color:var(--muted);font-size:.85rem;margin:-6px 0 12px}
.game{position:relative;cursor:pointer;transition:box-shadow .15s,border-color .15s}
body.pkg .game{cursor:default}
.check{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-weight:900;color:transparent}
body.pkg .check{display:none}
.game.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.game.sel .check{background:var(--blue);border-color:var(--blue);color:#0a0804}
.cart{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(22,18,10,.94);backdrop-filter:blur(8px);border-top:1px solid var(--blue);display:flex;align-items:center;justify-content:space-between;gap:10px;transform:translateY(110%);transition:transform .2s}
.cart.show{transform:none}
.cart .sum b{color:var(--blue)}
body.has-cart main{padding-bottom:110px}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--blue);border-radius:16px;padding:0;width:min(520px,calc(100% - 24px));max-height:80vh}
dialog::backdrop{background:rgba(0,0,0,.7)}
.sheet{padding:16px;display:flex;flex-direction:column;gap:12px;max-height:80vh}
.sheet h2{margin:0;font-size:1.3rem}
.sheet ol{margin:0;padding:0 0 0 22px;overflow:auto;flex:1;line-height:1.5}
.sheet li{padding:4px 0;border-bottom:1px solid var(--line);display:list-item}
.sheet li span{color:var(--muted);font-size:.85rem}
.sheet li button{float:right;background:none;border:0;color:var(--muted);font-size:1.1rem;cursor:pointer}
@media (prefers-reduced-motion:reduce){.cart,.game,.pic img{transition:none}}
.selhead{display:none;background:var(--card);border:1px solid var(--blue);border-radius:14px;padding:14px;margin:0 0 14px}
.selhead h2{margin:0 0 2px;font-size:1.3rem}
.selhead .meta{color:var(--muted);font-size:.9rem;margin-bottom:12px}
body.selview .selhead{display:block}
body.selview .hint{display:none}
.tabs button.seltab{border-style:dashed}
.lang{flex:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 11px;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer}
.topr{display:flex;align-items:center;gap:8px;flex:none}
.langrow{display:flex;justify-content:flex-end;margin:-6px 0 10px}
.call,.cap,.price,.bar{unicode-bidi:plaintext}
.name{unicode-bidi:plaintext}
[dir=rtl] .name,[dir=rtl] .pack,[dir=rtl] .pkghead{text-align:right}
[dir=rtl] .foot{text-align:center}
.thumbs{display:flex;gap:4px;margin-top:8px}
.thumbs .tb{width:34px;height:45px;flex:none;overflow:hidden;border-radius:4px;background:#211a0c;border:1px solid var(--line)}
.thumbs .tb img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .25s}
.thumbs .tb img.on{opacity:1}
.thumbs .more{width:34px;height:45px;border-radius:4px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--muted)}
@media (max-width:420px){.thumbs .tb:nth-child(n+4){display:none}}
.foot{margin-top:36px;padding:18px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.foot .row{justify-content:center}
.foot b{color:var(--ink)}
.foot .btn{unicode-bidi:plaintext}
.foot .info{display:flex;flex-direction:column;gap:3px}
[dir=rtl] .check{right:auto;left:8px}
.note{background:linear-gradient(160deg,#2a2008,#16120a 70%);border:1px solid var(--blue);border-radius:14px;padding:12px 14px;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.92rem}
.note[hidden]{display:none}
.empty .btn{margin-top:12px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>

var COVERS={},TRIED={};

var API="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&pilicense=any&pithumbsize=320";
function getJSON(u,tries){
  return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){
    if(tries>0)return new Promise(function(r){setTimeout(r,1200)}).then(function(){return getJSON(u,tries-1)});
    return null;
  });
}
function fetchBatch(titles){
  return getJSON(API+"&redirects=1&pilimit=50&titles="+encodeURIComponent(titles.join("|")),2).then(function(d){
    if(!d||!d.query)return;
    var q=d.query,map={};
    titles.forEach(function(t){map[t]=t});
    (q.normalized||[]).concat(q.redirects||[]).forEach(function(n){for(var k in map)if(map[k]===n.from)map[k]=n.to});
    var byTitle={},pages=q.pages||{};
    Object.keys(pages).forEach(function(id){var p=pages[id];if(p.thumbnail)byTitle[p.title]=p.thumbnail.source});
    titles.forEach(function(t){if(byTitle[map[t]])COVERS[t]=byTitle[map[t]]});
    saveCovers();
  });
}
function searchOne(x){
  return getJSON(API+"&generator=search&gsrlimit=1&gsrsearch="+encodeURIComponent(x.name+" video game"),1).then(function(d){
    var p=d&&d.query&&d.query.pages;if(!p)return;
    var id=Object.keys(p)[0];if(p[id].thumbnail){COVERS[wt(x)]=p[id].thumbnail.source;saveCovers()}
  });
}
function pool(items,n,fn){
  var i=0;function next(){if(i>=items.length)return Promise.resolve();var it=items[i++];return fn(it).then(next,next)}
  var w=[];for(var k=0;k<n;k++)w.push(next());return Promise.all(w);
}
/* پێشی وێنێن پەڕا نوکە، پاشی یێن پەڕێن دی ل پشت */
function loadFor(list){
  var need=list.filter(function(x){return !src(x)&&!TRIED[wt(x)]});
  if(!need.length)return Promise.resolve();
  need.forEach(function(x){TRIED[wt(x)]=1});
  var titles=need.map(wt),jobs=[];
  for(var i=0;i<titles.length;i+=50)jobs.push(fetchBatch(titles.slice(i,i+50)));
  return Promise.all(jobs).then(function(){
    paint();
    var miss=need.filter(function(x){return !src(x)});
    return pool(miss,4,function(x){return searchOne(x).then(paint)});
  }).then(paint);
}

function proxy(u){return /^https?:/.test(u)?"https://wsrv.nl/?url="+encodeURIComponent(u.replace(/^https?:\/\//,""))+"&w=300&q=78&output=webp":u}
function cands(x){
  var u=src(x);if(!u)return[];
  if(x.img&&/^https?:/.test(x.img))return[proxy(x.img),x.img];
  if(x.img)return[x.img];

}

    var x=GAMES[+d.dataset.i],p=d.classList.contains("tb")?d:d.querySelector(".pic"),list=cands(x);
    if(!list.length||p.dataset.key===list[0])return;
    p.dataset.key=list[0];
    var k=OK[list[0]]||0;
    (function tryOne(){
      if(p.dataset.key!==list[0])return;
      if(k>=list.length){ // هەمی نەهاتن → Wikipedia
        if(x.img){x.img="";p.dataset.key="";loadFor([x]).then(paint)}
        return;
      }
      var u=list[k],done=false;
      var im=new Image();im.alt=x.name;im.decoding="async";try{im.fetchPriority="high"}catch(e){}im.referrerPolicy="no-referrer";
      var t=setTimeout(function(){if(!done){done=true;im.src="";k++;tryOne()}},6000);
      im.onload=function(){if(done)return;done=true;clearTimeout(t);OK[list[0]]=k;
        if(p.dataset.key!==list[0])return;p.textContent="";p.appendChild(im);requestAnimationFrame(function(){im.className="on"})};
      im.onerror=function(){if(done)return;done=true;clearTimeout(t);k++;tryOne()};
      im.src=u;
    })();
  });
}

  }
  btn("‹",page-1,{dis:page===1,aria:L("prev")});
  for(var k=1;k<=pages;k++)btn(String(k),k,{cur:k===page,aria:"Page "+k});
  btn("›",page+1,{dis:page===pages,aria:L("next")});
}
document.getElementById("viewSel").onclick=function(){filter="Selected";page=1;render();window.scrollTo({top:0,behavior:"smooth"})};
document.getElementById("q").oninput=function(e){query=e.target.value.trim().toLowerCase();page=1;render()};
document.getElementById("home").onclick=goHome;
applyLang();renderFoot();
viewFromHash();
render();
</script>
