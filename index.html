<style>
:root{--bg:#0a0804;--card:#16120a;--line:#4a3a12;--ink:#fff8e6;--muted:#b3a47a;--blue:#f5b800;--red:#ff9d00;--teal:#2de2c8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 500px at 0 0,#f5b80030,transparent),radial-gradient(1200px 500px at 100% 100%,#ff7a0025,transparent),var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",Arial,sans-serif;min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:0 14px 48px}
a.back{color:var(--blue);text-decoration:none;font-size:.9rem}
h1{margin:14px 0 4px;font-size:2rem;letter-spacing:.04em}
.sub{color:var(--muted);margin:0 0 18px}
.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 -14px 16px;padding:10px 14px;background:rgba(10,8,4,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;min-width:0}
.logo .mark{width:42px;height:42px;flex:none;filter:drop-shadow(0 0 10px rgba(245,184,0,.35))}
.logo .word{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.logo b{font-size:1.1rem;font-weight:900;letter-spacing:.06em;white-space:nowrap}
.logo small{color:var(--blue);font-size:.68rem;font-weight:700;letter-spacing:.12em;white-space:nowrap}
.top .call{padding:8px 12px;font-size:.9rem;white-space:nowrap}
@media (max-width:380px){.logo b{font-size:.95rem}.top .call{font-size:.8rem;padding:7px 10px}}
.owner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:16px}
.who{display:flex;flex-direction:column;line-height:1.35}
.who span{color:var(--blue);font-size:.85rem;font-weight:700;letter-spacing:.06em}
.call{color:#0a0804;background:var(--blue);text-decoration:none;font-weight:700;padding:8px 14px;border-radius:999px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font:inherit;cursor:pointer}
.tabs button[aria-pressed=true]{border-color:var(--blue);box-shadow:0 0 12px #f5b80066;color:var(--blue)}
input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.game{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pic{aspect-ratio:3/4;background:#211a0c;display:flex;align-items:center;justify-content:center;font-size:2.2rem}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:8px 10px 10px}
.name{font-weight:700;overflow-wrap:anywhere}
.size{font-size:.8rem;color:var(--muted);margin-top:2px}
.tag{display:inline-block;margin-top:4px;font-size:.78rem;font-weight:700;padding:0 8px;border-radius:4px;color:#0a0804}
.PS3{background:#aab2d5}.PS4{background:var(--blue)}.PS5{background:var(--teal)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 12px;color:var(--muted);font-size:.9rem}
.pager{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:22px 0 4px}
.pager button{min-width:40px;height:40px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
.pager button[aria-current=page]{background:var(--blue);color:#0a0804;border-color:var(--blue)}
.pager button:disabled{opacity:.35;cursor:default}
.pic{position:relative}
.pic img{opacity:0;transition:opacity .25s}
.pic img.on{opacity:1}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.pack{text-align:left;background:linear-gradient(160deg,#2a2008,#16120a 70%);border:1px solid var(--blue);border-radius:14px;padding:12px 14px;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.pack .cap{font-size:1.5rem;font-weight:900;letter-spacing:.02em}
.pack .meta{color:var(--muted);font-size:.85rem}
.pack .price{color:var(--blue);font-weight:800;font-size:1.1rem;margin-top:4px}
.pkghead{display:none;background:var(--card);border:1px solid var(--blue);border-radius:14px;padding:14px;margin:0 0 16px}
.pkghead h2{margin:4px 0 2px;font-size:1.6rem}
.pkghead .price{color:var(--blue);font-weight:800;font-size:1.2rem}
.pkghead .meta{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;border-radius:999px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.main{background:var(--blue);border-color:var(--blue);color:#0a0804}
.btn.wa{background:#25d366;border-color:#25d366;color:#04140a}
.linkbtn{background:none;border:0;color:var(--blue);font:inherit;font-weight:700;cursor:pointer;padding:0}
body.pkg .packs,body.pkg #q,body.pkg #tabs,body.pkg #bar,body.pkg #pager,body.pkg .hint{display:none}
body.pkg .pkghead{display:block}
.hint{color:var(--muted);font-size:.85rem;margin:-6px 0 12px}
.game{position:relative;cursor:pointer;transition:box-shadow .15s,border-color .15s}
body.pkg .game{cursor:default}
.check{position:absolute;top:8px;right:8px;z-index:2;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);border:2px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-weight:900;color:transparent}
body.pkg .check{display:none}
.game.sel{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.game.sel .check{background:var(--blue);border-color:var(--blue);color:#0a0804}
.cart{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(22,18,10,.94);backdrop-filter:blur(8px);border-top:1px solid var(--blue);display:flex;align-items:center;justify-content:space-between;gap:10px;transform:translateY(110%);transition:transform .2s}
.cart.show{transform:none}
.cart .sum b{color:var(--blue)}
body.has-cart main{padding-bottom:110px}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--blue);border-radius:16px;padding:0;width:min(520px,calc(100% - 24px));max-height:80vh}
dialog::backdrop{background:rgba(0,0,0,.7)}
.sheet{padding:16px;display:flex;flex-direction:column;gap:12px;max-height:80vh}
.sheet h2{margin:0;font-size:1.3rem}
.sheet ol{margin:0;padding:0 0 0 22px;overflow:auto;flex:1;line-height:1.5}
.sheet li{padding:4px 0;border-bottom:1px solid var(--line);display:list-item}
.sheet li span{color:var(--muted);font-size:.85rem}
.sheet li button{float:right;background:none;border:0;color:var(--muted);font-size:1.1rem;cursor:pointer}
@media (prefers-reduced-motion:reduce){.cart,.game,.pic img{transition:none}}
.selhead{display:none;background:var(--card);border:1px solid var(--blue);border-radius:14px;padding:14px;margin:0 0 14px}
.selhead h2{margin:0 0 2px;font-size:1.3rem}
.selhead .meta{color:var(--muted);font-size:.9rem;margin-bottom:12px}
body.selview .selhead{display:block}
body.selview .hint{display:none}
.tabs button.seltab{border-style:dashed}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>

/* ====== پاکێج: یاری، بها و قەبارێ هاردی ل ڤێرێ بگوهۆڕە ====== */
var WHATSAPP="9647505047363";
var PACKAGES=[
  {id:"500", title:"500 GB", price:"15,000 IQD", games:[
    "Grand Theft Auto V",
    "A Way Out",
    "God of War",
    "Need for Speed Payback",
    "EA Sports FC 27",
    "Red Dead Redemption",
    "Call of Duty: Ghosts",
    "Minecraft",
    "Resident Evil 4",
    "Crash Bandicoot N. Sane Trilogy",
    "Battlefield V",
    "Sekiro: Shadows Die Twice"]},
  {id:"1tb", title:"1 TB", price:"20,000 IQD", games:[
    "Grand Theft Auto V",
    "EA Sports FC 27",
    "PES 27",
    "Call of Duty: Black Ops 3",
    "Need for Speed Heat",
    "The Last of Us Remastered",
    "Elden Ring",
    "Ghost of Tsushima",
    "Uncharted 4: A Thief's End",
    "Red Dead Redemption 2",
    "Tekken 7",
    "Sekiro: Shadows Die Twice",
    "Mortal Kombat 11",
    "Mafia III: Definitive Edition",
    "Assassin's Creed Valhalla",
    "Assassin's Creed Mirage"]}
];
/* ================================== */
var filter="All",query="",page=1,PER=15,view=null;
var PICK=[];try{PICK=JSON.parse(localStorage.getItem("picked")||"[]")}catch(e){PICK=[]}
function savePick(){try{localStorage.setItem("picked",JSON.stringify(PICK))}catch(e){}}
function byName(n){for(var i=0;i<GAMES.length;i++)if(GAMES[i].name===n)return GAMES[i];return null}
function gb(x){var m=x&&x.size&&String(x.size).match(/[\d.]+/);return m?parseFloat(m[0]):0}
function totalGB(names){return Math.round(names.reduce(function(t,n){return t+gb(byName(n))},0))}
PICK=PICK.filter(byName);

/* وێنە: ژ Wikipedia دهێنە ئینان و ل مۆبایلێ دهێنە پاراستن */
var COVERS={},TRIED={};
try{COVERS=JSON.parse(localStorage.getItem("covers3")||"{}")}catch(e){COVERS={}}
function saveCovers(){try{localStorage.setItem("covers3",JSON.stringify(COVERS))}catch(e){}}
function wt(x){return x.w||x.name}
function src(x){return x.img||COVERS[wt(x)]||""}
var API="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&pilicense=any&pithumbsize=320";
function getJSON(u,tries){
  return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()}).catch(function(){
    if(tries>0)return new Promise(function(r){setTimeout(r,1200)}).then(function(){return getJSON(u,tries-1)});
    return null;
  });
}
function fetchBatch(titles){
  return getJSON(API+"&redirects=1&pilimit=50&titles="+encodeURIComponent(titles.join("|")),2).then(function(d){
    if(!d||!d.query)return;
    var q=d.query,map={};
    titles.forEach(function(t){map[t]=t});
    (q.normalized||[]).concat(q.redirects||[]).forEach(function(n){for(var k in map)if(map[k]===n.from)map[k]=n.to});
    var byTitle={},pages=q.pages||{};
    Object.keys(pages).forEach(function(id){var p=pages[id];if(p.thumbnail)byTitle[p.title]=p.thumbnail.source});
    titles.forEach(function(t){if(byTitle[map[t]])COVERS[t]=byTitle[map[t]]});
    saveCovers();
  });
}
function searchOne(x){
  return getJSON(API+"&generator=search&gsrlimit=1&gsrsearch="+encodeURIComponent(x.name+" video game"),1).then(function(d){
    var p=d&&d.query&&d.query.pages;if(!p)return;
    var id=Object.keys(p)[0];if(p[id].thumbnail){COVERS[wt(x)]=p[id].thumbnail.source;saveCovers()}
  });
}
function pool(items,n,fn){
  var i=0;function next(){if(i>=items.length)return Promise.resolve();var it=items[i++];return fn(it).then(next,next)}
  var w=[];for(var k=0;k<n;k++)w.push(next());return Promise.all(w);
}
/* پێشی وێنێن پەڕا نوکە، پاشی یێن پەڕێن دی ل پشت */
function loadFor(list){
  var need=list.filter(function(x){return !src(x)&&!TRIED[wt(x)]});
  if(!need.length)return Promise.resolve();
  need.forEach(function(x){TRIED[wt(x)]=1});
  var titles=need.map(wt),jobs=[];
  for(var i=0;i<titles.length;i+=50)jobs.push(fetchBatch(titles.slice(i,i+50)));
  return Promise.all(jobs).then(function(){
    paint();
    var miss=need.filter(function(x){return !src(x)});
    return pool(miss,4,function(x){return searchOne(x).then(paint)});
  }).then(paint);
}
function paint(){
  document.querySelectorAll(".game").forEach(function(d){
    var x=GAMES[+d.dataset.i],p=d.querySelector(".pic"),u=src(x);
    if(!u||p.dataset.src===u)return;
    p.dataset.src=u;
    var im=new Image();im.alt=x.name;im.decoding="async";try{im.fetchPriority="high"}catch(e){}im.referrerPolicy="no-referrer";
    im.onload=function(){p.textContent="";p.appendChild(im);requestAnimationFrame(function(){im.className="on"})};
    im.onerror=function(){if(x.img){x.img="";p.dataset.src="";loadFor([x])}};
    im.src=u;
  });
}

function currentList(){
  if(filter==="Selected")return PICK.map(byName).filter(function(x){return x&&x.name.toLowerCase().indexOf(query)>-1});
  return GAMES.filter(function(x){
    return (filter==="All"||x.platform===filter)&&x.name.toLowerCase().indexOf(query)>-1;
  }).sort(function(a,b){return a.name.localeCompare(b.name,"en",{sensitivity:"base",numeric:true})});
}
function toggle(n,d){
  var k=PICK.indexOf(n);if(k>-1)PICK.splice(k,1);else PICK.push(n);
  savePick();
  if(filter==="Selected"){render();return}
  if(d){var on=k<0;d.classList.toggle("sel",on);d.setAttribute("aria-pressed",on)}
  var st=document.querySelector(".seltab");if(st)st.textContent="✓ My selection ("+PICK.length+")";
  renderCart();
}
function waLink(text){return "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(text)}
function pickText(){
  return "سلاڤ، ئەز ڤان یاریان دخوازم:\n"+PICK.map(function(n,i){return (i+1)+". "+n}).join("\n")+
    "\n\nکۆم: "+PICK.length+" یاری · ~"+totalGB(PICK)+" GB";
}
function renderCart(){
  var c=document.getElementById("cart"),show=PICK.length>0&&!view&&filter!=="Selected";
  c.classList.toggle("show",show);document.body.classList.toggle("has-cart",show);
  document.getElementById("sum").innerHTML="<b>"+PICK.length+"</b> selected · ~"+totalGB(PICK)+" GB";
  document.getElementById("waSel").href=waLink(pickText());
}
function renderSelHead(){
  var h=document.getElementById("selhead");h.innerHTML="";
  if(filter!=="Selected")return;
  var t=document.createElement("h2");t.textContent="✓ My selection";
  var m=document.createElement("div");m.className="meta";m.textContent=PICK.length+" games · ~"+totalGB(PICK)+" GB";
  h.appendChild(t);h.appendChild(m);
  if(!PICK.length)return;
  var row=document.createElement("div");row.className="row";
  var wa=document.createElement("a");wa.className="btn wa";wa.target="_blank";wa.rel="noopener";wa.textContent="Send on WhatsApp";wa.href=waLink(pickText());
  var cp=document.createElement("button");cp.className="btn";cp.textContent="Copy";
  cp.onclick=function(){
    (navigator.clipboard?navigator.clipboard.writeText(pickText()):Promise.reject()).then(function(){cp.textContent="Copied"},function(){cp.textContent="Copy failed"});
    setTimeout(function(){cp.textContent="Copy"},1500);
  };
  var cl=document.createElement("button");cl.className="btn";cl.textContent="Clear all";
  cl.onclick=function(){if(confirm("Remove all selected games?")){PICK=[];savePick();render()}};
  row.appendChild(wa);row.appendChild(cp);row.appendChild(cl);h.appendChild(row);
}
function renderPacks(){
  var box=document.getElementById("packs");box.innerHTML="";
  PACKAGES.forEach(function(pk){
    var names=pk.games.filter(byName);
    var b=document.createElement("button");b.className="pack";
    b.innerHTML='<span class="cap"></span><span class="meta"></span><span class="price"></span>';
    b.children[0].textContent="💽 "+pk.title;
    b.children[1].textContent=names.length+" games · ~"+totalGB(names)+" GB";
    b.children[2].textContent=pk.price;
    b.onclick=function(){openPackage(pk.id)};
    box.appendChild(b);
  });
}
function renderPackage(pk){
  var names=pk.games.filter(byName),h=document.getElementById("pkghead");
  h.innerHTML="";
  var back=document.createElement("button");back.className="linkbtn";back.textContent="‹ All games";
  back.onclick=function(){if(history.state&&history.state.v)history.back();else goHome()};
  var t=document.createElement("h2");t.textContent="💽 "+pk.title+" package";
  var pr=document.createElement("div");pr.className="price";pr.textContent=pk.price;
  var m=document.createElement("div");m.className="meta";m.textContent=names.length+" games · ~"+totalGB(names)+" GB";
  var row=document.createElement("div");row.className="row";
  var wa=document.createElement("a");wa.className="btn wa";wa.target="_blank";wa.rel="noopener";wa.textContent="Choose this package";
  wa.href=waLink("سلاڤ، ئەز پاکێجا "+pk.title+" دخوازم ("+names.length+" یاری · "+pk.price+"):\n"+names.map(function(n,i){return (i+1)+". "+n}).join("\n"));
  row.appendChild(wa);
  h.appendChild(back);h.appendChild(t);h.appendChild(pr);h.appendChild(m);h.appendChild(row);
  var g=document.getElementById("grid");g.innerHTML="";
  var list=names.map(byName);
  list.forEach(function(x){g.appendChild(card(x,false))});
  document.getElementById("pager").innerHTML="";
  paint();loadFor(list);
}
function goHome(e){
  if(e)e.preventDefault();
  view=null;filter="All";page=1;query="";document.getElementById("q").value="";
  if(location.hash)history.pushState(null,"",location.pathname+location.search);
  render();window.scrollTo({top:0,behavior:"smooth"});
}
function openPackage(id){
  view=id;history.pushState({v:id},"","#"+id);render();window.scrollTo({top:0,behavior:"smooth"});
}
function viewFromHash(){
  var h=location.hash.slice(1);
  view=PACKAGES.some(function(p){return p.id===h})?h:null;
}
window.addEventListener("popstate",function(){viewFromHash();render();window.scrollTo(0,0)});
var PRE={};
function prefetch(list){
  var urls=list.map(function(x){return x.img}).filter(function(u){return u&&!PRE[u]});
  var i=0;
  (function next(){
    if(i>=urls.length)return;
    var batch=urls.slice(i,i+4);i+=4;
    Promise.all(batch.map(function(u){PRE[u]=1;return new Promise(function(r){var im=new Image();im.referrerPolicy="no-referrer";im.onload=im.onerror=r;im.src=u})})).then(function(){setTimeout(next,50)});
  })();
}
function render(scroll){
  document.body.classList.toggle("pkg",!!view);
  renderPacks();renderCart();
  if(view){var pk=PACKAGES.filter(function(p){return p.id===view})[0];if(pk){renderPackage(pk);return}view=null;document.body.classList.remove("pkg")}
  var t=document.getElementById("tabs");t.innerHTML="";
  ["All","PS5","PS4","PS3","Selected"].forEach(function(f){
    var n=f==="All"?GAMES.length:f==="Selected"?PICK.length:GAMES.filter(function(x){return x.platform===f}).length;
    var b=document.createElement("button");b.textContent=(f==="Selected"?"✓ My selection":f)+" ("+n+")";b.setAttribute("aria-pressed",f===filter);
    if(f==="Selected")b.className="seltab";
    b.onclick=function(){filter=f;page=1;render()};t.appendChild(b);
  });
  document.body.classList.toggle("selview",filter==="Selected");
  renderSelHead();
  var list=currentList(),pages=Math.max(1,Math.ceil(list.length/PER));
  if(page>pages)page=pages;
  var shown=list.slice((page-1)*PER,page*PER);
  var g=document.getElementById("grid");g.innerHTML="";
  document.getElementById("bar").textContent=list.length?(list.length+" games · Page "+page+" / "+pages):"";
  if(!list.length){g.innerHTML='<div class="empty"></div>';g.firstChild.textContent=filter==="Selected"&&!query?"No games selected yet. Go to All and tap games to choose them.":"No games found."}
  shown.forEach(function(x){g.appendChild(card(x,true))});
  renderPager(pages);
  paint();
  loadFor(shown).then(function(){return loadFor(list)}).then(function(){return loadFor(GAMES)});
  setTimeout(function(){prefetch(list.slice(page*PER).concat(list.slice(0,(page-1)*PER)))},300);
  if(scroll)document.getElementById("bar").scrollIntoView({behavior:"smooth",block:"start"});
}
function card(x,selectable){
    var d=document.createElement("div");d.className="game";d.dataset.i=GAMES.indexOf(x);
    var p=document.createElement("div");p.className="pic";p.textContent="🎮";
    var i=document.createElement("div");i.className="info";
    var n=document.createElement("div");n.className="name";n.textContent=x.name;
    var s=document.createElement("span");s.className="tag "+x.platform;s.textContent=x.platform;
    i.appendChild(n);
    if(x.size){var z=document.createElement("div");z.className="size";z.textContent="💾 "+x.size;i.appendChild(z)}
    i.appendChild(s);d.appendChild(p);d.appendChild(i);
    if(selectable){
      var c=document.createElement("span");c.className="check";c.textContent="✓";c.setAttribute("aria-hidden","true");d.appendChild(c);
      d.tabIndex=0;d.setAttribute("role","button");
      var on=PICK.indexOf(x.name)>-1;d.classList.toggle("sel",on);d.setAttribute("aria-pressed",on);
      d.setAttribute("aria-label",x.name);
      d.onclick=function(){toggle(x.name,d)};
      d.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle(x.name,d)}};
    }
    return d;
}
function renderPager(pages){
  var nav=document.getElementById("pager");nav.innerHTML="";
  if(pages<2)return;
  function btn(label,to,opts){
    var b=document.createElement("button");b.textContent=label;
    if(opts&&opts.cur)b.setAttribute("aria-current","page");
    if(opts&&opts.dis)b.disabled=true;
    if(opts&&opts.aria)b.setAttribute("aria-label",opts.aria);
    b.onclick=function(){page=to;render(true)};nav.appendChild(b);
  }
  btn("‹",page-1,{dis:page===1,aria:"Previous page"});
  for(var k=1;k<=pages;k++)btn(String(k),k,{cur:k===page,aria:"Page "+k});
  btn("›",page+1,{dis:page===pages,aria:"Next page"});
}
document.getElementById("viewSel").onclick=function(){filter="Selected";page=1;render();window.scrollTo({top:0,behavior:"smooth"})};
document.getElementById("q").oninput=function(e){query=e.target.value.trim().toLowerCase();page=1;render()};
document.getElementById("home").onclick=goHome;
viewFromHash();
render();
